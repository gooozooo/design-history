<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시대 디자인 카드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="main-container">
    <header class="main-header">
      <p class="sub-title">DESIGN HISTORY ARCHIVE</p>
      <h1>시대별 디자인 카드</h1>
      <p class="description">
        카드를 선택하면 해당 시대의 디자인 페이지로 이동합니다.
      </p>
    </header>

    <div class="card-arc-wrap">
      <section class="card-arc" aria-label="시대 카드 목록">
        <a class="era-card ancient" href="ancient.html">
          <span class="card-number">01</span>
          <div class="card-text">
            <h2>고대</h2>
            <p>Ancient</p>
          </div>
        </a>

        <a class="era-card medieval" href="medieval.html">
          <span class="card-number">02</span>
          <div class="card-text">
            <h2>중세</h2>
            <p>Medieval</p>
          </div>
        </a>

        <a class="era-card renaissance" href="renaissance.html">
          <span class="card-number">03</span>
          <div class="card-text">
            <h2>르네상스</h2>
            <p>Renaissance</p>
          </div>
        </a>

        <a class="era-card industrial" href="industrial.html">
          <span class="card-number">04</span>
          <div class="card-text">
            <h2>산업화</h2>
            <p>Industrial</p>
          </div>
        </a>

        <a class="era-card war" href="war.html">
          <span class="card-number">05</span>
          <div class="card-text">
            <h2>전쟁디자인</h2>
            <p>War Design</p>
          </div>
        </a>

        <a class="era-card modern" href="modern.html">
          <span class="card-number">06</span>
          <div class="card-text">
            <h2>모던</h2>
            <p>Modern</p>
          </div>
        </a>
      </section>
    </div>

    <p class="rotate-notice">더 편하게 보려면 휴대폰을 가로로 돌려 주세요.</p>
  </main>
  <a
  href="https://github.com/gooozooo"
  target="_blank"
  class="profile-link"
>
  <img src="me.png" alt="profile">
</a>
</body>

</html>
