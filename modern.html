<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모던 디자인</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Malgun Gothic", "Noto Sans KR", sans-serif;
  background: #f7f7f4;
}

.modern-page {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at center, #fff 0%, #f2f2ef 68%, #e8e8e3 100%);
  cursor: pointer;
}

.back-button {
  position: absolute;
  top: 24px;
  left: 28px;
  z-index: 50;
  text-decoration: none;
  color: rgba(0, 0, 0, 0.65);
  font-size: 15px;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.6);
}

.page-title {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  text-align: center;
  color: rgba(0, 0, 0, 0.74);
  pointer-events: none;
}

.page-title p {
  margin: 0 0 6px;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: rgba(0, 0, 0, 0.45);
}

.page-title h1 {
  margin: 0;
  font-size: 38px;
  line-height: 1;
}

.period {
  margin-top: 8px;
  font-size: 14px;
  color: rgba(0, 0, 0, 0.52);
}

.flower-wrap {
  position: absolute;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -50%);
  width: min(62vw, 760px);
  height: min(62vw, 760px);
}

svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.piece {
  filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.17));
}

.keyword {
  font-size: 28px;
  font-weight: 800;
  fill: white;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  letter-spacing: 0.04em;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.hint {
  position: absolute;
  right: 28px;
  bottom: 24px;
  z-index: 40;
  color: rgba(0, 0, 0, 0.52);
  font-size: 14px;
}

/* 모바일 가로 */
@media (max-width: 950px) and (orientation: landscape) {
  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .modern-page {
    width: 100vw;
    height: 100dvh;
  }

  .back-button {
    top: 10px;
    left: 12px;
    font-size: 11px;
    padding: 6px 9px;
  }

  .page-title {
    top: 8px;
  }

  .page-title p {
    margin-bottom: 3px;
    font-size: 8px;
  }

  .page-title h1 {
    font-size: 22px;
  }

  .period {
    margin-top: 4px;
    font-size: 9px;
  }

  .flower-wrap {
    width: 66vh;
    height: 66vh;
    top: 58%;
  }

  .keyword {
    font-size: 18px;
  }

  .hint {
    right: 12px;
    bottom: 8px;
    font-size: 10px;
  }
}

/* 더 낮은 모바일 가로 */
@media (max-width: 740px) and (orientation: landscape) {
  .page-title h1 {
    font-size: 19px;
  }

  .period {
    display: none;
  }

  .flower-wrap {
    width: 62vh;
    height: 62vh;
    top: 59%;
  }

  .keyword {
    font-size: 16px;
  }

  .hint {
    display: none;
  }
}

/* 모바일 세로 */
@media (max-width: 900px) and (orientation: portrait) {
  .modern-page::after {
    content: "휴대폰을 가로로 돌려서 감상해 주세요.";
    position: absolute;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background: #e9e9e9;
    color: rgba(0, 0, 0, 0.74);
    font-size: 18px;
    line-height: 1.7;
  }
}
</style>
</head>

<body>
<main class="modern-page" id="page">
  <a href="index.html" class="back-button">← 카드 목록</a>

  <header class="page-title">
    <p>MODERN DESIGN</p>
    <h1>모던시대</h1>
    <div class="period">20세기 초 ~ 현재</div>
  </header>

  <section class="flower-wrap">
    <svg viewBox="0 0 760 760">
      <defs>
        <mask id="mask0">
          <rect width="760" height="760" fill="white"/>
          <circle class="cut cut-0-1" r="150" fill="black"/>
          <circle class="cut cut-0-2" r="150" fill="black"/>
          <circle class="cut cut-0-3" r="150" fill="black"/>
        </mask>

        <mask id="mask1">
          <rect width="760" height="760" fill="white"/>
          <circle class="cut cut-1-0" r="150" fill="black"/>
          <circle class="cut cut-1-2" r="150" fill="black"/>
          <circle class="cut cut-1-3" r="150" fill="black"/>
        </mask>

        <mask id="mask2">
          <rect width="760" height="760" fill="white"/>
          <circle class="cut cut-2-0" r="150" fill="black"/>
          <circle class="cut cut-2-1" r="150" fill="black"/>
          <circle class="cut cut-2-3" r="150" fill="black"/>
        </mask>

        <mask id="mask3">
          <rect width="760" height="760" fill="white"/>
          <circle class="cut cut-3-0" r="150" fill="black"/>
          <circle class="cut cut-3-1" r="150" fill="black"/>
          <circle class="cut cut-3-2" r="150" fill="black"/>
        </mask>
      </defs>

      <circle id="c0" class="piece" r="150" fill="#1f73bd" mask="url(#mask0)" />
      <circle id="c1" class="piece" r="150" fill="#e60012" mask="url(#mask1)" />
      <circle id="c2" class="piece" r="150" fill="#1f73bd" mask="url(#mask2)" />
      <circle id="c3" class="piece" r="150" fill="#e60012" mask="url(#mask3)" />

      <text id="t0" class="keyword">유토피아</text>
      <text id="t1" class="keyword">인간</text>
      <text id="t2" class="keyword">기능</text>
      <text id="t3" class="keyword">정서</text>
    </svg>
  </section>

  <p class="hint">화면을 클릭해서 모던 디자인의 키워드를 이동시켜 보세요.</p>
</main>

<script>
const page = document.getElementById("page");

const slots = [
  { x: 285, y: 285 },
  { x: 475, y: 285 },
  { x: 475, y: 475 },
  { x: 285, y: 475 }
];

const circles = [
  {
    el: document.getElementById("c0"),
    text: document.getElementById("t0"),
    slot: 0,
    x: slots[0].x,
    y: slots[0].y
  },
  {
    el: document.getElementById("c1"),
    text: document.getElementById("t1"),
    slot: 1,
    x: slots[1].x,
    y: slots[1].y
  },
  {
    el: document.getElementById("c2"),
    text: document.getElementById("t2"),
    slot: 2,
    x: slots[2].x,
    y: slots[2].y
  },
  {
    el: document.getElementById("c3"),
    text: document.getElementById("t3"),
    slot: 3,
    x: slots[3].x,
    y: slots[3].y
  }
];

let moving = false;

function updateSVG() {
  circles.forEach((circle) => {
    circle.el.setAttribute("cx", circle.x);
    circle.el.setAttribute("cy", circle.y);
    circle.text.setAttribute("x", circle.x);
    circle.text.setAttribute("y", circle.y);
  });

  circles.forEach((circle, i) => {
    circles.forEach((other, j) => {
      if (i === j) return;

      document.querySelectorAll(`.cut-${i}-${j}`).forEach((cut) => {
        cut.setAttribute("cx", other.x);
        cut.setAttribute("cy", other.y);
      });
    });
  });
}

function animateMove() {
  if (moving) return;

  moving = true;

  const start = circles.map((c) => ({
    x: c.x,
    y: c.y
  }));

  circles.forEach((c) => {
    c.slot = (c.slot + 3) % 4;
  });

  const end = circles.map((c) => ({
    x: slots[c.slot].x,
    y: slots[c.slot].y
  }));

  const duration = 850;
  const startTime = performance.now();

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    circles.forEach((c, i) => {
      c.x = start[i].x + (end[i].x - start[i].x) * ease;
      c.y = start[i].y + (end[i].y - start[i].y) * ease;
    });

    updateSVG();

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      moving = false;
    }
  }

  requestAnimationFrame(frame);
}

updateSVG();
page.addEventListener("click", animateMove);
</script>
</body>
</html>
