<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전쟁디자인</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: #090807;
    }

    .war-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #090807;
    }

    .bunker-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
      filter: brightness(0.72) contrast(1.08) saturate(0.82);
      user-select: none;
      pointer-events: none;
    }

    .dark-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(
        circle at 56% 64%,
        rgba(255, 205, 122, 0.18),
        rgba(0, 0, 0, 0.28) 42%,
        rgba(0, 0, 0, 0.62) 100%
      );
      pointer-events: none;
    }

    .lamp-light {
      position: absolute;
      left: 48%;
      top: 42%;
      width: 520px;
      height: 360px;
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 219, 151, 0.28) 0%,
        rgba(255, 179, 82, 0.1) 42%,
        rgba(255, 179, 82, 0) 72%
      );
      filter: blur(12px);
      animation: lampFlicker 4.8s ease-in-out infinite;
    }

    @keyframes lampFlicker {
      0%,
      100% {
        opacity: 0.75;
      }

      45% {
        opacity: 0.58;
      }

      52% {
        opacity: 0.9;
      }

      57% {
        opacity: 0.64;
      }
    }

    .dust-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .dust {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 231, 185, 0.17);
      filter: blur(0.6px);
      animation: dustFloat linear infinite;
    }

    @keyframes dustFloat {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }

      12% {
        opacity: 0.9;
      }

      100% {
        transform: translate(26px, -120px);
        opacity: 0;
      }
    }

    .back-button {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 40;
      color: rgba(255, 245, 225, 0.9);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .page-title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      text-align: center;
      color: rgba(255, 245, 225, 0.95);
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .page-title p {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.2em;
      opacity: 0.82;
    }

    .page-title h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1;
    }

    .book-stage {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(44vw, 440px);
      aspect-ratio: 440 / 311;
      height: auto;
      transform: translate(-50%, -50%);
      perspective: 1600px;
      z-index: 15;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 28px 28px rgba(0, 0, 0, 0.58));
    }

    .book.closed {
      width: 50%;
      margin-left: 25%;
    }

    .book-spread {
      position: absolute;
      inset: 0;
      display: flex;
      background: #3b2416;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 2px rgba(55, 32, 18, 0.65),
        inset 0 0 26px rgba(0, 0, 0, 0.35);
    }

    .page {
      position: relative;
      width: 50%;
      height: 100%;
      background: #e6d7bd;
      overflow: hidden;
    }

    .book.closed .page {
      width: 100%;
    }

    .page.left {
      border-right: 1px solid rgba(60, 38, 24, 0.32);
      box-shadow: inset -18px 0 24px rgba(80, 45, 25, 0.22);
    }

    .page.right {
      box-shadow: inset 18px 0 24px rgba(80, 45, 25, 0.18);
    }

    .book.closed .page.left,
    .book.closed .book-center,
    .book.closed .prev-corner {
      display: none;
    }

    .page img,
    .flip-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.18) contrast(0.98);
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .blank-page {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f2e8d7 0%, #dfc9a8 100%);
      position: relative;
      overflow: hidden;
    }

    .blank-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(105, 74, 42, 0.06) 0px,
        rgba(105, 74, 42, 0.06) 1px,
        transparent 1px,
        transparent 18px
      );
      opacity: 0.55;
    }

    .blank-page::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.24), transparent 36%),
        radial-gradient(circle at 78% 72%, rgba(95, 55, 28, 0.1), transparent 42%);
    }

    .page::after,
    .flip-face::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 247, 225, 0.16),
        rgba(68, 38, 20, 0.1)
      );
      pointer-events: none;
    }

    .book-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 12px;
      transform: translateX(-50%);
      z-index: 8;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.3),
        rgba(255, 255, 255, 0.12),
        rgba(0, 0, 0, 0.3)
      );
      pointer-events: none;
    }

    .corner,
    .prev-corner {
      position: absolute;
      bottom: 0;
      width: 58px;
      height: 58px;
      z-index: 30;
      cursor: pointer;
    }

    .corner {
      right: 0;
    }

    .prev-corner {
      left: 0;
    }

    .corner::before,
    .prev-corner::before {
      content: "";
      position: absolute;
      bottom: 0;
      width: 58px;
      height: 58px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .corner::before {
      right: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0) 46%,
        rgba(252, 243, 221, 0.95) 47%,
        rgba(182, 149, 106, 0.98) 100%
      );
      clip-path: polygon(100% 0, 100% 100%, 0 100%, 24% 82%, 45% 58%, 66% 28%);
      box-shadow:
        -6px -6px 16px rgba(0, 0, 0, 0.26),
        inset -4px -4px 8px rgba(255, 255, 255, 0.28);
    }

    .prev-corner::before {
      left: 0;
      background: linear-gradient(
        225deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0) 46%,
        rgba(252, 243, 221, 0.92) 47%,
        rgba(182, 149, 106, 0.95) 100%
      );
      clip-path: polygon(0 0, 100% 100%, 0 100%, 0 0, 32% 28%, 55% 58%, 76% 82%);
      box-shadow:
        6px -6px 16px rgba(0, 0, 0, 0.24),
        inset 4px -4px 8px rgba(255, 255, 255, 0.24);
    }

    .corner:hover::before {
      transform: translate(-5px, -5px);
      filter: brightness(1.14);
    }

    .prev-corner:hover::before {
      transform: translate(5px, -5px);
      filter: brightness(1.14);
    }

    .flip-page {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      z-index: 25;
      transform-style: preserve-3d;
      display: none;
    }

    .book.closed .flip-page {
      width: 100%;
    }

    .flip-page.next {
      right: 0;
      transform-origin: left center;
      animation: turnNext 0.9s cubic-bezier(.45, .05, .2, 1) forwards;
      display: block;
    }

    .flip-page.prev {
      left: 0;
      transform-origin: right center;
      animation: turnPrev 0.9s cubic-bezier(.45, .05, .2, 1) forwards;
      display: block;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      overflow: hidden;
      background: #e6d7bd;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    @keyframes turnNext {
      0% {
        transform: rotateY(0deg);
      }

      40% {
        box-shadow: -18px 12px 26px rgba(0, 0, 0, 0.32);
      }

      100% {
        transform: rotateY(-180deg);
      }
    }

    @keyframes turnPrev {
      0% {
        transform: rotateY(0deg);
      }

      40% {
        box-shadow: 18px 12px 26px rgba(0, 0, 0, 0.32);
      }

      100% {
        transform: rotateY(180deg);
      }
    }

    .page-counter {
      position: absolute;
      left: 50%;
      bottom: -30px;
      transform: translateX(-50%);
      color: rgba(255, 238, 203, 0.82);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      user-select: none;
    }

    .hint {
      position: absolute;
      right: 28px;
      bottom: 24px;
      z-index: 30;
      color: rgba(255, 239, 210, 0.86);
      font-size: 14px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    /* 모바일 가로 */
    @media (max-width: 950px) and (orientation: landscape) {
      .war-page {
        height: 100dvh;
      }

      .back-button {
        top: 10px;
        left: 12px;
        font-size: 11px;
        padding: 6px 9px;
      }

      .page-title {
        top: 8px;
      }

      .page-title p {
        margin-bottom: 3px;
        font-size: 8px;
      }

      .page-title h1 {
        font-size: 22px;
      }

      .book-stage {
        width: min(42vw, 300px);
        top: 59%;
      }

      .book {
        filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.56));
      }

      .corner,
      .prev-corner,
      .corner::before,
      .prev-corner::before {
        width: 38px;
        height: 38px;
      }

      .page-counter {
        bottom: -21px;
        font-size: 9px;
      }

      .hint {
        right: 12px;
        bottom: 8px;
        font-size: 10px;
      }

      .lamp-light {
        width: 300px;
        height: 210px;
      }
    }

    /* 더 낮은 모바일 가로 */
    @media (max-width: 740px) and (orientation: landscape) {
      .page-title h1 {
        font-size: 19px;
      }

      .book-stage {
        width: min(40vw, 240px);
        top: 60%;
      }

      .corner,
      .prev-corner,
      .corner::before,
      .prev-corner::before {
        width: 32px;
        height: 32px;
      }

      .hint {
        display: none;
      }
    }

    /* 모바일 세로 */
    @media (max-width: 900px) and (orientation: portrait) {
      .war-page::after {
        content: "휴대폰을 가로로 돌려서 감상해 주세요.";
        position: absolute;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #e9e9e9;
        color: rgba(0, 0, 0, 0.74);
        font-size: 18px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>
  <main class="war-page">
    <img class="bunker-bg" src="5-1.png" alt="벙커 책상 배경" />
    <div class="dark-overlay"></div>
    <div class="lamp-light"></div>
    <div class="dust-layer" id="dustLayer"></div>

    <a href="index.html" class="back-button">← 카드 목록</a>

    <header class="page-title">
      <p>WAR DESIGN ARCHIVE</p>
      <h1>전쟁디자인</h1>
    </header>

    <section class="book-stage">
      <div class="book closed" id="book">
        <div class="book-spread">
          <div class="page left" id="leftPageBox">
            <div class="blank-page"></div>
          </div>

          <div class="page right">
            <img id="rightPage" src="5-2.jpg" alt="책 표지" />
          </div>

          <div class="book-center"></div>

          <div class="prev-corner" id="prevCorner" title="이전 페이지"></div>
          <div class="corner" id="nextCorner" title="다음 페이지"></div>

          <div class="flip-page" id="flipPage">
            <div class="flip-face flip-front">
              <img id="flipFront" src="5-2.jpg" alt="" />
            </div>
            <div class="flip-face flip-back">
              <div class="blank-page"></div>
            </div>
          </div>
        </div>

        <div class="page-counter" id="pageCounter">COVER</div>
      </div>
    </section>

    <p class="hint">접힌 책장 끝을 클릭해서 기록을 넘겨 보세요.</p>
  </main>

  <script>
    const cover = "5-2.jpg";
    const pages = [
      "5-3.jpg",
      "5-4.jpg",
      "5-5.jpg",
      "5-6.jpg"
    ];

    let pageIndex = -1;
    let isFlipping = false;

    const book = document.getElementById("book");
    const leftPageBox = document.getElementById("leftPageBox");
    const rightPage = document.getElementById("rightPage");
    const nextCorner = document.getElementById("nextCorner");
    const prevCorner = document.getElementById("prevCorner");
    const flipPage = document.getElementById("flipPage");
    const flipFront = document.getElementById("flipFront");
    const pageCounter = document.getElementById("pageCounter");
    const dustLayer = document.getElementById("dustLayer");

    function renderBook() {
      flipPage.className = "flip-page";
      leftPageBox.innerHTML = `<div class="blank-page"></div>`;

      if (pageIndex === -1) {
        book.classList.add("closed");
        rightPage.src = cover;
        pageCounter.textContent = "COVER";
        prevCorner.style.display = "none";
        nextCorner.style.display = "block";
        return;
      }

      book.classList.remove("closed");
      rightPage.src = pages[pageIndex];

      pageCounter.textContent = `${pageIndex + 1} / ${pages.length}`;
      prevCorner.style.display = "block";
      nextCorner.style.display = pageIndex >= pages.length - 1 ? "none" : "block";
    }

    function nextPage() {
      if (isFlipping) return;
      if (pageIndex >= pages.length - 1) return;

      isFlipping = true;
      flipPage.className = "flip-page next";
      flipPage.style.right = "0";
      flipPage.style.left = "";

      flipFront.src = pageIndex === -1 ? cover : pages[pageIndex];

      setTimeout(() => {
        pageIndex += 1;
        renderBook();
        isFlipping = false;
      }, 900);
    }

    function prevPage() {
      if (isFlipping) return;
      if (pageIndex <= -1) return;

      isFlipping = true;
      flipPage.className = "flip-page prev";
      flipPage.style.left = "0";
      flipPage.style.right = "";

      flipFront.src = pages[pageIndex];

      setTimeout(() => {
        pageIndex -= 1;
        renderBook();
        isFlipping = false;
      }, 900);
    }

    nextCorner.addEventListener("click", nextPage);
    prevCorner.addEventListener("click", prevPage);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextPage();
      if (e.key === "ArrowLeft") prevPage();
    });

    function createDust() {
      for (let i = 0; i < 42; i++) {
        const dust = document.createElement("span");
        dust.className = "dust";

        const size = Math.random() * 3 + 1;
        dust.style.width = size + "px";
        dust.style.height = size + "px";
        dust.style.left = Math.random() * 100 + "%";
        dust.style.top = Math.random() * 100 + "%";
        dust.style.animationDuration = Math.random() * 12 + 12 + "s";
        dust.style.animationDelay = -Math.random() * 20 + "s";

        dustLayer.appendChild(dust);
      }
    }

    createDust();
    renderBook();
  </script>
</body>
</html>
