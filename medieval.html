<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중세 디자인</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: #111;
      color: #fff;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
    }

    .back-link {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 30;
      text-decoration: none;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(8px);
    }

    .title-box {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      text-align: center;
      pointer-events: none;
    }

    .title-box .eyebrow {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 0.22em;
      font-weight: 700;
      opacity: 0.8;
    }

    .title-box h1 {
      margin: 0;
      font-size: 50px;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .title-box p {
      margin: 12px 0 0;
      font-size: 15px;
      opacity: 0.82;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .base-img,
    .modern-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      pointer-events: none;
    }

    .base-img {
      z-index: 1;
      filter: brightness(0.78);
    }

    .modern-img {
      z-index: 2;
      clip-path: circle(190px at 50% 50%);
      filter: brightness(1.04);
    }

    .magnifier {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 400px;
      height: 400px;
      transform: translate(-50%, -50%);
      z-index: 5;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.28),
        0 18px 50px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(0, 0, 0, 0.38);
      padding: 9px 14px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    @media (max-width: 950px) and (orientation: landscape) {
      .page {
        height: 100dvh;
      }

      .back-link {
        top: 10px;
        left: 12px;
        font-size: 11px;
        padding: 7px 10px;
      }

      .title-box {
        top: 10px;
        width: 70vw;
      }

      .title-box .eyebrow {
        margin-bottom: 3px;
        font-size: 9px;
      }

      .title-box h1 {
        font-size: 26px;
      }

      .title-box p {
        margin-top: 5px;
        font-size: 10px;
      }

      .base-img,
      .modern-img {
        object-position: center center;
      }

      .modern-img {
        clip-path: circle(92px at 50% 55%);
      }

      .magnifier {
        width: 190px;
        height: 190px;
        top: 55%;
        border-width: 1.5px;
      }

      .hint {
        bottom: 10px;
        font-size: 10px;
        padding: 6px 10px;
      }
    }

    @media (max-width: 740px) and (orientation: landscape) {
      .title-box p {
        display: none;
      }

      .modern-img {
        clip-path: circle(75px at 50% 56%);
      }

      .magnifier {
        width: 155px;
        height: 155px;
        top: 56%;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a href="index.html" class="back-link">← 카드 목록</a>

    <section class="title-box">
      <p class="eyebrow">MEDIEVAL DESIGN</p>
      <h1>중세</h1>
      <p>고딕 건축의 수직성과 현대적 재해석</p>
    </section>

    <section class="stage" id="stage">
      <img src="2-1.png" alt="중세 고딕 배경" class="base-img" />
      <img src="2-2.png" alt="현대 고딕 배경" class="modern-img" id="modernImg" />
      <div class="magnifier" id="magnifier"></div>
    </section>

    <div class="hint">화면을 움직이면 렌즈 안에서 현대 고딕 디자인이 드러납니다.</div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const modernImg = document.getElementById("modernImg");
    const magnifier = document.getElementById("magnifier");

    function moveLens(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      magnifier.style.left = `${x}px`;
      magnifier.style.top = `${y}px`;

      const radius = window.matchMedia("(max-width: 740px) and (orientation: landscape)").matches
        ? 75
        : window.matchMedia("(max-width: 950px) and (orientation: landscape)").matches
          ? 92
          : 190;

      modernImg.style.clipPath = `circle(${radius}px at ${x}px ${y}px)`;
    }

    stage.addEventListener("mousemove", (e) => {
      moveLens(e.clientX, e.clientY);
    });

    stage.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      moveLens(touch.clientX, touch.clientY);
    }, { passive: true });

    window.addEventListener("load", () => {
      moveLens(window.innerWidth / 2, window.innerHeight * 0.55);
    });

    window.addEventListener("resize", () => {
      moveLens(window.innerWidth / 2, window.innerHeight * 0.55);
    });
  </script>
</body>
</html>
