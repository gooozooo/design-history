<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고대 디자인</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Malgun Gothic","Noto Sans KR",sans-serif;
  background:#000;
}

.ancient-page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  cursor:pointer;
}

.bg-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

.back-button{
  position:absolute;
  top:24px;
  left:28px;
  z-index:90;
  text-decoration:none;
  color:white;
  font-size:15px;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}

.bg-toggle{
  position:absolute;
  top:82px;
  left:28px;
  width:200px;
  height:200px;
  border-radius:50%;
  z-index:100;
  border:0;
  cursor:pointer;
  box-shadow:none;
}

.page-title{
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:70;
  text-align:center;
  color:white;
  pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}

.page-title p{
  margin-bottom:6px;
  font-size:12px;
  letter-spacing:.2em;
}

.page-title h1{
  font-size:38px;
}

.period{
  margin-top:8px;
  font-size:14px;
}

.hint{
  position:absolute;
  right:28px;
  bottom:24px;
  z-index:70;
  color:white;
  font-size:14px;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}

@media (max-width:900px) and (orientation:landscape){
  .back-button{
    top:14px;
    left:16px;
    font-size:12px;
  }

  .bg-toggle{
    top:44px;
    left:16px;
    width:100px;
    height:100px;
  }

  .page-title{
    top:12px;
  }

  .page-title h1{
    font-size:24px;
  }

  .page-title p{
    font-size:10px;
  }

  .period{
    font-size:11px;
  }

  .hint{
    right:14px;
    bottom:12px;
    font-size:11px;
  }
}

@media (max-width:900px) and (orientation:portrait){
  .ancient-page::after{
    content:"휴대폰을 가로로 돌려서 감상해 주세요.";
    position:absolute;
    inset:0;
    z-index:999;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:18px;
    color:#333;
  }
}
/* 모바일 가로: 16:9 고정 화면을 축소해서 보여주기 */
@media (max-width:900px) and (orientation:landscape){
  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#e9e9e9;
  }

  .ancient-page,
  .medieval-page,
  .room-page,
  .industrial-page,
  .war-page,
  .modern-page{
    width:1280px !important;
    height:720px !important;
    position:absolute !important;
    left:50% !important;
    top:50% !important;
    transform:translate(-50%,-50%) scale(.54) !important;
    transform-origin:center center !important;
    overflow:hidden !important;
  }
}

@media (min-width:800px) and (max-width:950px) and (orientation:landscape){
  .ancient-page,
  .medieval-page,
  .room-page,
  .industrial-page,
  .war-page,
  .modern-page{
    transform:translate(-50%,-50%) scale(.58) !important;
  }
}

@media (max-width:700px) and (orientation:landscape){
  .ancient-page,
  .medieval-page,
  .room-page,
  .industrial-page,
  .war-page,
  .modern-page{
    transform:translate(-50%,-50%) scale(.48) !important;
  }
}
</style>
</head>

<body>

<main class="ancient-page" id="page">

  <img
    src="1-1.png"
    class="bg-img"
    id="bgImg"
    alt="고대 이집트 배경"
  >

  <a href="index.html" class="back-button" id="backButton">
    ← 카드 목록
  </a>

  <button class="bg-toggle" id="bgToggle" aria-label="배경 색상 변경"></button>

  <header class="page-title">
    <p>ANCIENT DESIGN</p>
    <h1>고대</h1>
    <div class="period">기원전 13세기 ~ 기원전 7세기</div>
  </header>

  <p class="hint">해 혹은 달을 클릭하면 시간이, 배경을 클릭하면 건물이 바뀝니다.</p>

</main>

<script>
const page = document.getElementById("page");
const bgImg = document.getElementById("bgImg");
const bgToggle = document.getElementById("bgToggle");
const backButton = document.getElementById("backButton");

/*
1-1.png = 검은 배경 + 컬러 건물
1-2.png = 흰 배경 + 컬러 건물
1-3.png = 흰 배경 + 검은 건물
1-4.png = 검은 배경 + 흰 건물
*/

let currentState = "1-1";

function updateImage(){
  bgImg.src = currentState + ".png";

  if(currentState === "1-1" || currentState === "1-4"){
    bgToggle.style.backgroundColor = "white";
  }else{
    bgToggle.style.backgroundColor = "black";
  }
}

/* 원 클릭: 배경색만 변경 + 원 색도 배경 반대색으로 변경 */
bgToggle.addEventListener("click",(e)=>{
  e.stopPropagation();

  if(currentState === "1-1"){
    currentState = "1-2";
  }
  else if(currentState === "1-2"){
    currentState = "1-1";
  }
  else if(currentState === "1-3"){
    currentState = "1-4";
  }
  else if(currentState === "1-4"){
    currentState = "1-3";
  }

  updateImage();
});

/* 배경 클릭: 건물색만 변경 */
page.addEventListener("click",()=>{
  if(currentState === "1-1"){
    currentState = "1-4";
  }
  else if(currentState === "1-4"){
    currentState = "1-1";
  }
  else if(currentState === "1-2"){
    currentState = "1-3";
  }
  else if(currentState === "1-3"){
    currentState = "1-2";
  }

  updateImage();
});

backButton.addEventListener("click",(e)=>{
  e.stopPropagation();
});

updateImage();
</script>

</body>
</html>
