<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>고대 디자인</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Malgun Gothic","Noto Sans KR",sans-serif;
  background:#000;
}

.ancient-page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  cursor:pointer;
  background:#000;
}

.bg-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  z-index:1;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

.back-button{
  position:absolute;
  top:24px;
  left:28px;
  z-index:90;
  text-decoration:none;
  color:white;
  font-size:15px;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}

.bg-toggle{
  position:absolute;
  top:82px;
  left:28px;
  width:200px;
  height:200px;
  border-radius:50%;
  z-index:100;
  border:0;
  cursor:pointer;
  box-shadow:none;
}

.page-title{
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:70;
  text-align:center;
  color:white;
  pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
  white-space:nowrap;
}

.page-title p{
  margin-bottom:6px;
  font-size:12px;
  letter-spacing:.2em;
}

.page-title h1{
  font-size:38px;
  line-height:1.1;
}

.period{
  margin-top:8px;
  font-size:14px;
}

.hint{
  position:absolute;
  right:28px;
  bottom:24px;
  z-index:70;
  color:white;
  font-size:14px;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
  white-space:nowrap;
}

/* 모바일 가로 */
@media (max-width:950px) and (orientation:landscape){
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  .ancient-page{
    width:100vw;
    height:100vh;
    height:100dvh;
    position:relative;
    overflow:hidden;
  }

  .bg-img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  .back-button{
    top:calc(env(safe-area-inset-top) + 8px);
    left:calc(env(safe-area-inset-left) + 12px);
    font-size:11px;
    z-index:120;
  }

  .bg-toggle{
    top:calc(env(safe-area-inset-top) + 42px);
    left:calc(env(safe-area-inset-left) + 14px);
    width:82px;
    height:82px;
    z-index:110;
  }

  .page-title{
    top:calc(env(safe-area-inset-top) + 6px);
    width:70vw;
  }

  .page-title p{
    margin-bottom:2px;
    font-size:8px;
    letter-spacing:.18em;
  }

  .page-title h1{
    font-size:20px;
    line-height:1;
  }

  .period{
    margin-top:3px;
    font-size:9px;
  }

  .hint{
    right:calc(env(safe-area-inset-right) + 12px);
    bottom:calc(env(safe-area-inset-bottom) + 10px);
    max-width:70vw;
    font-size:10px;
    line-height:1.4;
    white-space:normal;
    text-align:right;
  }
}

/* 더 낮은 모바일 가로 */
@media (max-width:740px) and (orientation:landscape){
  .page-title{
    top:calc(env(safe-area-inset-top) + 5px);
  }

  .page-title h1{
    font-size:18px;
  }

  .page-title p{
    font-size:7px;
  }

  .period{
    font-size:8px;
  }

  .bg-toggle{
    width:70px;
    height:70px;
    top:calc(env(safe-area-inset-top) + 38px);
  }

  .hint{
    font-size:9px;
    max-width:66vw;
  }
}

/* 모바일 세로 */
@media (max-width:900px) and (orientation:portrait){
  .ancient-page::after{
    content:"휴대폰을 가로로 돌려서 감상해 주세요.";
    position:absolute;
    inset:0;
    z-index:999;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:18px;
    color:#333;
  }
}
</style>
</head>

<body>

<main class="ancient-page" id="page">

  <img
    src="1-1.png"
    class="bg-img"
    id="bgImg"
    alt="고대 이집트 배경"
  >

  <a href="index.html" class="back-button" id="backButton">
    ← 카드 목록
  </a>

  <button class="bg-toggle" id="bgToggle" aria-label="배경 색상 변경"></button>

  <header class="page-title">
    <p>ANCIENT DESIGN</p>
    <h1>고대</h1>
    <div class="period">기원전 13세기 ~ 기원전 7세기</div>
  </header>

  <p class="hint">해 혹은 달을 클릭하면 시간이, 배경을 클릭하면 건물이 바뀝니다.</p>

</main>

<script>
const page = document.getElementById("page");
const bgImg = document.getElementById("bgImg");
const bgToggle = document.getElementById("bgToggle");
const backButton = document.getElementById("backButton");

let currentState = "1-1";

function updateImage(){
  bgImg.src = currentState + ".png";

  if(currentState === "1-1" || currentState === "1-4"){
    bgToggle.style.backgroundColor = "white";
  }else{
    bgToggle.style.backgroundColor = "black";
  }
}

bgToggle.addEventListener("click",(e)=>{
  e.stopPropagation();

  if(currentState === "1-1"){
    currentState = "1-2";
  }
  else if(currentState === "1-2"){
    currentState = "1-1";
  }
  else if(currentState === "1-3"){
    currentState = "1-4";
  }
  else if(currentState === "1-4"){
    currentState = "1-3";
  }

  updateImage();
});

page.addEventListener("click",()=>{
  if(currentState === "1-1"){
    currentState = "1-4";
  }
  else if(currentState === "1-4"){
    currentState = "1-1";
  }
  else if(currentState === "1-2"){
    currentState = "1-3";
  }
  else if(currentState === "1-3"){
    currentState = "1-2";
  }

  updateImage();
});

backButton.addEventListener("click",(e)=>{
  e.stopPropagation();
});

updateImage();
</script>

</body>
</html>
